name: CD — Deploy to Production

on:
  workflow_run:
    workflows: [CI — Lint, Test, Build]
    types: [completed]
    branches: [main]

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Use OIDC — no long-lived AWS keys stored in secrets
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Configure AWS credentials via OIDC (no long-lived keys) ────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: bharatmedia-deploy-${{ github.run_id }}

      # ── Deploy Backend to AWS App Runner ───────────────────────────────────
      - name: Trigger App Runner deployment (backend)
        run: |
          echo "Triggering App Runner deployment..."
          aws apprunner start-deployment \
            --service-arn "${{ secrets.APP_RUNNER_SERVICE_ARN }}" \
            --region "${{ secrets.AWS_REGION }}"
          echo "App Runner deployment triggered successfully."

      # ── Deploy Frontend to Vercel ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend for production
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: npm run build

      - name: Deploy to Vercel (production)
        working-directory: frontend
        run: |
          npm install -g vercel@latest
          vercel deploy --prod \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --yes

      # ── Post-deployment summary ────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: App Runner deployment triggered ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: Vercel production deployment complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

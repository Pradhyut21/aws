version: 1.0
runtime: nodejs20

build:
  commands:
    - npm ci
    - npm run build

run:
  command: npm start
  network:
    port: 4000
    env: PORT

# Health check — App Runner pings this to confirm service is alive
healthcheck:
  path: /health
  interval: 10
  timeout: 5
  healthyThreshold: 1
  unhealthyThreshold: 3

# Auto-scaling — keep min=1 so judges can click the URL after deadline
# without hitting a cold-start timeout
scaling:
  minSize: 1
  maxSize: 3
  maxConcurrency: 25

cpu: 1 vCPU
memory: 2 GB

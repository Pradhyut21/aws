version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || (nvm install 20 && nvm use 20)
            - node --version
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      environment:
        nodeVersion: '20'
    appRoot: frontend
  - backend: {}

customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'

# SPA rewrite: all paths → index.html so React Router works
redirects:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
    target: '/index.html'
    status: '200'
